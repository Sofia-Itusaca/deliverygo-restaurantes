apiVersion: apps/v1
kind: Deployment
metadata: {name: deliverygo-restaurantes, namespace: deliverygo}
spec:
  replicas: 2
  selector: {matchLabels: {app: deliverygo-restaurantes}}
  template:
    metadata: {labels: {app: deliverygo-restaurantes}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: restaurant-service
          image: ACCOUNT.dkr.ecr.us-east-2.amazonaws.com/deliverygo-restaurantes:IMAGE_TAG
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: deliverygo-restaurantes}}]
          env: [{name: ConnectionStrings__Restaurants, valueFrom: {secretKeyRef: {name: deliverygo-db, key: postgres-connection}}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: deliverygo-restaurantes, namespace: deliverygo}
spec: {selector: {app: deliverygo-restaurantes}, ports: [{port: 8081, targetPort: http}], type: ClusterIP}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: deliverygo-restaurantes, namespace: deliverygo}
data: {ASPNETCORE_URLS: "http://+:8081", FrontendOrigin: "https://deliverygo.example"}
